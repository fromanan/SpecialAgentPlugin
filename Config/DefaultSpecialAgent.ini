[/Script/SpecialAgent.SpecialAgentSettings]
; Server Configuration
ServerEnabled=true
ServerPort=8767
TransportType=HTTP
MaxConcurrentRequests=10
LoopbackOnly=true
RequireAuthToken=false
AuthToken=
AllowedOrigins=http://localhost,http://127.0.0.1,http://[::1]

; Asset Service
AssetCacheEnabled=true
AssetCacheRefreshInterval=5.0

; Python Service
PythonSandboxEnabled=true
PythonExecutionEnabled=true
PythonExecutionTimeout=30.0
AllowedPythonModules=unreal,math,json,random,sys,io,traceback

; Viewport Service
DefaultScreenshotWidth=1920
DefaultScreenshotHeight=1080
MaxScreenshotWidth=4096
MaxScreenshotHeight=4096
ScreenshotFormat=PNG

; Logging
LogLevel=Verbose
LogToFile=true

